<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="布告欄記事與運動建議小工具" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>長者關懷小幫手</title>
</head>
<body>
  <main class="app-main">
    <section id="panel-hub" class="panel hub-panel active" role="region" aria-label="首頁">
      <h1 class="hub-title">長者關懷小幫手</h1>
      <p class="hub-subtitle">記事布告欄 ‧ 健康動一動 ‧ 佈置小遊戲</p>
      <div class="hub-cards">
        <button class="hub-card" type="button" data-view="board">
          <span class="hub-card-icon" aria-hidden="true">📋</span>
          <span class="hub-card-text">
            <span class="hub-card-title">布告欄</span>
            <span class="hub-card-desc">記事與提醒</span>
          </span>
        </button>
        <button class="hub-card" type="button" data-view="exercise">
          <span class="hub-card-icon" aria-hidden="true">🏃</span>
          <span class="hub-card-text">
            <span class="hub-card-title">運動建議</span>
            <span class="hub-card-desc">健康動一動</span>
          </span>
        </button>
        <button class="hub-card" type="button" data-view="room">
          <span class="hub-card-icon" aria-hidden="true">🏠</span>
          <span class="hub-card-text">
            <span class="hub-card-title">佈置遊戲</span>
            <span class="hub-card-desc">設計我的家</span>
          </span>
        </button>
      </div>
    </section>

    <section id="panel-board" class="panel board-panel" role="region" aria-label="布告欄" hidden>
      <header class="panel-header">
        <button class="back-arrow" type="button" data-go="hub" aria-label="返回首頁">←</button>
        <h2 class="panel-title">布告欄</h2>
      </header>
      <form id="note-form" class="note-form" autocomplete="off">
        <label for="note-input" class="visually-hidden">新增記事</label>
        <input id="note-input" name="note" type="text" placeholder="輸入記事後按 Enter 或 ＋ 新增" maxlength="120" required />
        <button type="submit" class="btn btn-primary" aria-label="新增">＋</button>
      </form>
      <ul id="note-list" class="note-list" aria-live="polite"></ul>
      <p id="note-empty" class="empty-hint">目前沒有記事，新增一條吧！</p>
    </section>

    <section id="panel-exercise" class="panel exercise-panel" role="region" aria-label="運動建議" hidden>
      <header class="panel-header">
        <button class="back-arrow" type="button" data-go="hub" aria-label="返回首頁">←</button>
        <h2 class="panel-title">運動建議</h2>
      </header>
      <div class="exercise-controls">
        <label for="exercise-part">想動哪裡？</label>
        <select id="exercise-part" aria-label="選擇部位">
          <option value="any">隨機</option>
          <option value="whole">全身</option>
          <option value="upper">上半身</option>
          <option value="lower">下半身</option>
          <option value="seated">坐著就能做</option>
        </select>
        <button id="exercise-pick" class="btn btn-primary" type="button">給我一個建議</button>
      </div>
      <div id="exercise-card" class="exercise-card" aria-live="polite">
        <h3 id="exercise-title">尚未選擇</h3>
        <p id="exercise-desc">按下「給我一個建議」開始</p>
        <p id="exercise-meta" class="meta"></p>
      </div>
      <details class="exercise-list">
        <summary>查看全部建議</summary>
        <ul id="exercise-all"></ul>
      </details>
    </section>

    <section id="panel-room" class="panel room-panel" role="region" aria-label="佈置遊戲" hidden>
      <header class="panel-header room-header">
        <button class="back-arrow" type="button" data-go="hub" aria-label="返回首頁">←</button>
        <h2 class="panel-title">佈置遊戲</h2>
        <button id="room-reset" type="button" class="btn btn-ghost btn-reset">重置</button>
      </header>

      <div class="bg-section">
        <span class="section-label">背景</span>
        <div class="bg-picker" id="bg-picker" role="radiogroup" aria-label="背景選擇"></div>
      </div>

      <div class="cat-tabs" id="cat-tabs" role="tablist" aria-label="道具分類"></div>

      <div class="inventory-scroll">
        <div class="inventory-row" id="inventory-row" role="list"></div>
      </div>

      <div id="room-area" class="room-area">
        <div id="selection-menu" class="selection-menu" hidden>
          <button type="button" data-act="shrink" class="menu-btn" aria-label="縮小">➖</button>
          <button type="button" data-act="grow" class="menu-btn" aria-label="放大">➕</button>
          <button type="button" data-act="delete" class="menu-btn menu-btn-danger" aria-label="刪除">🗑</button>
          <button type="button" data-act="close" class="menu-btn menu-btn-primary" aria-label="完成">✓</button>
        </div>
      </div>

      <details class="custom-section">
        <summary>新增我的素材</summary>
        <div class="custom-controls">
          <label class="custom-upload-btn">
            <input type="file" id="item-upload" accept="image/*" hidden />
            <span class="btn btn-ghost">＋ 上傳圖片</span>
          </label>
          <button id="custom-clear" type="button" class="btn btn-ghost">清除全部</button>
        </div>
        <p class="hint">上傳後會出現在「我的素材」分類，建議每張小於 500 KB。</p>
      </details>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./js/store.js"></script>
  <script src="./js/board.js"></script>
  <script src="./js/exercise.js"></script>
  <script src="./js/room.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
